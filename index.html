<style>
@import url('https://fonts.googleapis.com/css2?family=Fredoka+One&display=swap');
.val-wrap {
  min-height: 520px;
  background: #f5a0b5;
  border-radius: 24px;
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
  overflow: hidden;
  padding: 40px 20px;
}
.val-wrap::before {
  content: '';
  position: absolute;
  inset: 0;
  background: radial-gradient(ellipse at 60% 30%, #f9c0cc 0%, #f5a0b5 50%, #e07090 100%);
  border-radius: 24px;
}
.hearts-bg { position: absolute; inset: 0; pointer-events: none; overflow: hidden; border-radius: 24px; }
.hb { position: absolute; font-size: 18px; animation: fheart linear infinite; opacity: 0; }
@keyframes fheart {
  0% { transform: translateY(520px) rotate(0deg); opacity: 0; }
  10% { opacity: 0.55; }
  90% { opacity: 0.35; }
  100% { transform: translateY(-40px) rotate(15deg); opacity: 0; }
}
.val-card {
  position: relative;
  z-index: 2;
  text-align: center;
  max-width: 340px;
  width: 100%;
}
.val-title {
  font-family: 'Fredoka One', cursive, sans-serif;
  font-size: 1.8rem;
  color: #7a1535;
  margin-bottom: 24px;
  line-height: 1.2;
}
.pulse { display: inline-block; animation: pulse 1.3s ease-in-out infinite; }
@keyframes pulse { 0%,100%{transform:scale(1)} 40%{transform:scale(1.3)} 60%{transform:scale(1.15)} }
.cat-anim { animation: catbob 2.8s ease-in-out infinite; display: inline-block; margin-bottom: 28px; }
@keyframes catbob { 0%,100%{transform:translateY(0) rotate(-1deg)} 50%{transform:translateY(-8px) rotate(1deg)} }
.btn-area { display: flex; align-items: center; justify-content: center; gap: 16px; flex-wrap: wrap; position: relative; min-height: 170px; }
.btn-yes {
  background: #27a558;
  color: white;
  border: none;
  border-radius: 50px;
  padding: 18px 60px;
  font-family: 'Fredoka One', cursive, sans-serif;
  font-size: 1.65rem;
  cursor: pointer;
  box-shadow: 0 4px 16px rgba(39,165,88,0.4);
  transition: transform 0.15s, box-shadow 0.15s;
}
.btn-yes:hover { transform: scale(1.08); box-shadow: 0 6px 22px rgba(39,165,88,0.55); }
.btn-no {
  background: #e03030;
  color: white;
  border: none;
  border-radius: 50px;
  padding: 9px 20px;
  font-family: 'Fredoka One', cursive, sans-serif;
  font-size: 1rem;
  cursor: pointer;
  transition: transform 0.12s;
  position: absolute;
  left: 50%;
  top: 50%;
  transform: translate(60px, -50%);
  white-space: nowrap;
}
.yay-title {
  font-family: 'Fredoka One', cursive, sans-serif;
  font-size: 2.2rem;
  color: #7a1535;
  margin-bottom: 16px;
  animation: popIn 0.5s cubic-bezier(0.175,0.885,0.32,1.275) both;
}
.yay-sub {
  font-family: 'Fredoka One', cursive, sans-serif;
  font-size: 1.1rem;
  color: #8b1a3a;
  margin-top: 16px;
}
@keyframes popIn { 0%{transform:scale(0.3);opacity:0} 100%{transform:scale(1);opacity:1} }
.hidden { display: none; }
</style>

<script>
var noCount = 0;
var maxR = 110;
var MIN_NO_SCALE = 0.28;
var BASE_ESCAPE_X = 90;
var ESCAPE_X_PER_TRY = 18;
var BASE_ESCAPE_Y = 35;
var ESCAPE_Y_PER_TRY = 10;
var MAX_YES_SCALE = 2.4;
var BASE_YES_SCALE = 1.15;
var YES_SCALE_PER_TRY = 0.2;

function runAway(event) {
  noCount++;
  var btn = document.getElementById('noBtn');
  var area = document.getElementById('btnArea');
  var areaW = area.offsetWidth || 300;
  var areaH = area.offsetHeight || 170;
  var scale = Math.max(MIN_NO_SCALE, 1 - noCount * 0.1);
  var rx = (Math.random() - 0.5) * areaW * 0.95;
  var ry = (Math.random() - 0.5) * areaH * 1.2;
  if (event && typeof event.clientX === 'number' && typeof event.clientY === 'number') {
    var r = area.getBoundingClientRect();
    var pointerFromCenterX = event.clientX - (r.left + r.width / 2);
    var pointerFromCenterY = event.clientY - (r.top + r.height / 2);
    rx += (pointerFromCenterX >= 0 ? -1 : 1) * (BASE_ESCAPE_X + noCount * ESCAPE_X_PER_TRY);
    ry += (pointerFromCenterY >= 0 ? -1 : 1) * (BASE_ESCAPE_Y + noCount * ESCAPE_Y_PER_TRY);
  }
  var maxRX = areaW * 0.48;
  var maxRY = areaH * 0.7;
  rx = Math.max(-maxRX, Math.min(maxRX, rx));
  ry = Math.max(-maxRY, Math.min(maxRY, ry));
  btn.style.transition = 'transform 0.18s cubic-bezier(0.175,0.885,0.32,1.275), left 0.18s, top 0.18s';
  btn.style.transform = 'translate(' + (60 + rx) + 'px, calc(-50% + ' + ry + 'px)) scale(' + scale + ')';
  var yes = document.querySelector('.btn-yes');
  var ys = Math.min(MAX_YES_SCALE, BASE_YES_SCALE + noCount * YES_SCALE_PER_TRY);
  yes.style.transform = 'scale(' + ys + ')';
  if (noCount >= 10) { btn.style.opacity = '0'; btn.style.pointerEvents = 'none'; }
}

function sayYes() {
  document.getElementById('mainScreen').classList.add('hidden');
  document.getElementById('yayScreen').classList.remove('hidden');
  for (var i = 0; i < 14; i++) { (function(i){ setTimeout(function(){ addHeart(); }, i * 90); })(i); }
}

function addHeart() {
  var c = document.getElementById('heartsContainer');
  var h = document.createElement('div');
  h.className = 'hb';
  var icons = ['&#x1F497;','&#x1F495;','&#x1F496;','&#x1FA77;','&#x2764;&#xFE0F;'];
  h.innerHTML = icons[Math.floor(Math.random() * icons.length)];
  h.style.left = (5 + Math.random() * 88) + '%';
  h.style.bottom = '0';
  h.style.animationDuration = (5 + Math.random() * 4) + 's';
  h.style.animationDelay = '0s';
  h.style.fontSize = (14 + Math.random() * 10) + 'px';
  c.appendChild(h);
  setTimeout(function(){ h.remove(); }, 10000);
}

(function initHearts(){
  var c = document.getElementById('heartsContainer');
  var icons = ['&#x1F497;','&#x1F495;','&#x1FA77;'];
  for(var i=0;i<7;i++){
    (function(i){
      var h = document.createElement('div');
      h.className = 'hb';
      h.innerHTML = icons[i % icons.length];
      h.style.left = (5 + i * 13) + '%';
      h.style.animationDuration = (6 + Math.random()*4) + 's';
      h.style.animationDelay = (Math.random()*5) + 's';
      h.style.fontSize = (12 + Math.random()*8) + 'px';
      c.appendChild(h);
    })(i);
  }
})();
</script>
